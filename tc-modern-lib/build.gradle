base { archivesName = 'tc-modern-lib' }

repositories {
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
}


// The API artifact has no Minecraft/Forge classes. The full mod also contains it.
sourceSets { api }
// Gradle's project dependency uses the classes variant during compilation.
// Export API classes there as well as in the final mod JAR.
sourceSets.main.output.classesDirs.from(sourceSets.api.output.classesDirs)
// Tests use only MFCL's API JAR: the full mod registers its own RuntimeProvider service, which would clash with
// the tests' fake runtime.
dependencies {
    compileOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-forge-api:${rootProject.jei_version}")
    testImplementation fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}")
    if (rootProject.devProperty('standaloneLib').getOrElse('false').toBoolean()) {
        runtimeOnly fg.deobf(rootProject.mfclRuntimeDependency)
        if (rootProject.devProperty('withJei').getOrElse('true').toBoolean())
            runtimeOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}")
    }
    apiCompileOnly rootProject.mfclApiDependency
    implementation sourceSets.api.output
    testImplementation sourceSets.api.output
    testImplementation rootProject.mfclApiDependency
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }
tasks.named('sourcesJar') { from sourceSets.api.allSource }
tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from sourceSets.api.output
}
tasks.register('apiSourcesJar', Jar) {
    archiveClassifier = 'api-sources'
    from sourceSets.api.allSource
}
tasks.named('assemble') { dependsOn 'apiJar', 'apiSourcesJar' }
publishing.publications {
    developerApi(MavenPublication) {
        artifactId = 'tc-modern-api'
        artifact(tasks.named('apiJar')) { classifier = null }
        artifact(tasks.named('apiSourcesJar')) { classifier = 'sources' }
    }
}

// MLA contracts may name original classes with class literals (@LegacyType(type = EntityPlayer.class)).
// The member-less stubs are built from a prepared MFCL 1.7.10 runtime and the original Thaumcraft JAR.
def legacyRuntime = rootProject.devProperty('legacyRuntimeDir')
        .map { rootProject.file(it) }
        .getOrElse(rootProject.file('run/mfcl/runtime/1.7.10'))
def legacyMods = rootProject.fileTree(new File(
        rootProject.file(rootProject.devProperty('gameDir').getOrElse('run')), 'mods')) {
    include 'Thaumcraft-*.jar'
}
ext.mfclDirect = [
        runtime : legacyRuntime,
        mods    : legacyMods,
        names   : ['api', 'main'],
        packaged: false,
]
apply from: rootProject.file('gradle/mfcl-direct.gradle')

// Standalone development run, useful for verifying the library without TC4: Modern installed.
minecraft {
    copyIdeResources = true
    runs {
        client {
            workingDirectory rootProject.file(rootProject.devProperty('gameDir').getOrElse('run'))
            if (providers.gradleProperty('libJeiSmokeTest').isPresent()) property 'tcmodernlib.jeiSmokeTest', 'true'
            if (providers.gradleProperty('libNoJeiSmokeTest').isPresent()) property 'tcmodernlib.noJeiSmokeTest', 'true'
            if (rootProject.devProperty('legacyRuntimeDir').isPresent())
                property 'mfcl.legacyRuntimeDir', rootProject.file(rootProject.devProperty('legacyRuntimeDir').get()).absolutePath
            mods { tcmodernlib { source sourceSets.main } }
        }
    }
}
