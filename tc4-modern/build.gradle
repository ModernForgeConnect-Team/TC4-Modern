base { archivesName = 'tc4-modern' }

repositories {
    maven {
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
    maven {
        url = 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }
    if (rootProject.devProperty('sscRuntimeJar').isPresent()) {
        flatDir {
            dirs rootProject.file(rootProject.devProperty('sscRuntimeJar').get()).parentFile
            content { includeGroup 'local.ssc' }
        }
    }
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        // location of the maven that hosts JEI files before January 2023
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        url "https://cursemaven.com"
    }
}

dependencies {
    implementation project(':tc-modern-lib')
    def localSsc = rootProject.devProperty('sscRuntimeJar')
    if (localSsc.isPresent()) {
        def jarName = rootProject.file(localSsc.get()).name
        def coordinates = (jarName =~ /^(.+?)-(\d.+)\.jar$/)
        if (!coordinates.matches()) throw new GradleException("Local SSC JAR must have a name-version.jar filename: ${jarName}")
        implementation fg.deobf("local.ssc:${coordinates[0][1]}:${coordinates[0][2]}")
    } else {
        implementation fg.deobf("curse.maven:shape-shifter-curse-forge-1683902:9429367")
    }
    implementation fg.deobf("curse.maven:geckolib-388172:8285794")
    compileOnly fg.deobf("dev.ftb.mods:ftb-quests-forge:${rootProject.ftb_quests_version}")
    compileOnly fg.deobf("dev.ftb.mods:ftb-library-forge:${rootProject.ftb_library_version}")
    testImplementation fg.deobf("dev.ftb.mods:ftb-library-forge:${rootProject.ftb_library_version}")
    compileOnly fg.deobf('dev.ftb.mods:ftb-teams-forge:2001.3.0')
    compileOnly fg.deobf('dev.architectury:architectury-forge:9.1.12')
    // Enabled in development by default, optional in production. Disable with -PwithFtbQuests=false.
    if (rootProject.devProperty('withFtbQuests').getOrElse('true').toBoolean()) {
        runtimeOnly fg.deobf("dev.ftb.mods:ftb-quests-forge:${rootProject.ftb_quests_version}")
        runtimeOnly fg.deobf("dev.ftb.mods:ftb-library-forge:${rootProject.ftb_library_version}")
        runtimeOnly fg.deobf('dev.ftb.mods:ftb-teams-forge:2001.3.0')
        runtimeOnly fg.deobf('dev.architectury:architectury-forge:9.1.12')
    }
    compileOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-forge-api:${rootProject.jei_version}")
    // Optional in production. Disable in development with -PwithJei=false.
    if (rootProject.devProperty('withJei').getOrElse('true').toBoolean()) {
        runtimeOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}")
    }
    // Curios is optional and takes precedence over the original Baubles slots when present.
    // Disable in development with -PwithCurios=false to test the Baubles-only path.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${rootProject.curios_version}:api")
    if (rootProject.devProperty('withCurios').getOrElse('true').toBoolean()) {
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${rootProject.curios_version}")
    }
    // Jade is optional; it shows the essentia held by original TC4 containers. Disable with -PwithJade=false.
    compileOnly fg.deobf("maven.modrinth:jade:${rootProject.jade_version}")
    if (rootProject.devProperty('withJade').getOrElse('true').toBoolean()) {
        runtimeOnly fg.deobf("maven.modrinth:jade:${rootProject.jade_version}")
    }
    implementation fg.deobf(rootProject.mfclRuntimeDependency)
    // A local API JAR still needs to be visible to tests; the CurseForge mod JAR above already contains the API.
    if (!(rootProject.mfclApiDependency instanceof CharSequence)) testImplementation rootProject.mfclApiDependency
    testImplementation fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}")
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Compile-only copies of MFCL API types added after MFCL 0.2.10 (client screens, native block and item providers).
// Never packaged: Forge rejects a package split across two mods, and at runtime every use is guarded by a
// presence/feature check, so MFCL 0.2.10 keeps the hosted original GUIs, blocks and items.
sourceSets { mfclStubs }
dependencies {
    mfclStubsCompileOnly rootProject.mfclApiDependency
    compileOnly sourceSets.mfclStubs.output
    testImplementation sourceSets.mfclStubs.output
}
def checkNoMfclStubs = tasks.register('checkNoMfclStubs') {
    def archive = tasks.named('jar').flatMap { it.archiveFile }
    inputs.file(archive)
    doLast {
        zipTree(archive.get()).matching { include 'github/com/gengyoubo/mfcl/**' }.each {
            throw new GradleException("MFCL API stubs must not be packaged: ${it}")
        }
    }
}
tasks.named('check') { dependsOn checkNoMfclStubs }

// Temporary backport of MFCL 1.0.8 fixes onto the CurseForge MFCL 0.2.10 file, applied at load time.
// src/mfclPatch holds the MFCL classes that changed (0.2.10 + fix commits, see src/mfclPatch/README.md),
// src/mfclPatchLegacy the changed classes of MFCL's old-runtime helper JAR. MfclPatchTool turns them into
// class copies the mixin plugin (github.com.gengyoubo.tcmodern.tc4.mfclpatch) moves into the original classes.
// Always built against the CurseForge file, whatever mfclRuntimeJar points at: that is what the patch targets.
configurations {
    mfclPatchBase { transitive = false }
    mfclPatchRaw { transitive = false }
}
sourceSets {
    mfclPatch
    mfclPatchLegacy
    mfclPatchTool
}
dependencies {
    mfclPatchBase fg.deobf(rootProject.mfclCurseDependency)
    mfclPatchRaw rootProject.mfclCurseDependency
    mfclPatchToolImplementation 'org.ow2.asm:asm-commons:9.7.1'
    mfclPatchToolImplementation 'org.ow2.asm:asm-tree:9.7.1'
    mfclPatchLegacyCompileOnly 'net.minecraft:launchwrapper:1.12'
    mfclPatchLegacyCompileOnly 'org.ow2.asm:asm-debug-all:5.0.3'
    mfclPatchLegacyCompileOnly 'com.google.guava:guava:17.0'
    mfclPatchLegacyCompileOnly 'net.minecraftforge:forge:1.7.10-10.13.4.1614-1.7.10:universal'
}
configurations.mfclPatchCompileClasspath.extendsFrom(configurations.minecraft, configurations.mfclPatchBase)
tasks.named('compileMfclPatchLegacyJava', JavaCompile) { options.release = 8 }
def mfclPatchDir = layout.buildDirectory.dir('mfclpatch')
// MFCL 0.2.10's own old-runtime helper JAR, the base the legacy patch is compiled against and merged into.
def extractMfclLegacy = tasks.register('extractMfclLegacy', Sync) {
    from({ zipTree(configurations.mfclPatchRaw.singleFile) }) { include 'mfcl/mfcl-legacy-runtime.jar' }
    into mfclPatchDir.map { it.dir('original') }
}
def mfclLegacyOriginal = files(mfclPatchDir.map { it.file('original/mfcl/mfcl-legacy-runtime.jar') }).builtBy(extractMfclLegacy)
dependencies { mfclPatchLegacyCompileOnly mfclLegacyOriginal }
def mfclPatchLegacyJar = tasks.register('mfclPatchLegacyJar', Jar) {
    archiveFileName = 'mfcl-legacy-runtime.jar'
    destinationDirectory = mfclPatchDir.map { it.dir('legacy/tc4modern/mfclpatch') }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    def patched = sourceSets.mfclPatchLegacy.output
    from(patched)
    from({ zipTree(mfclLegacyOriginal.singleFile) }) {
        // Keep the original manifest; drop every class the patch provides.
        exclude { element ->
            element.path.endsWith('.class') && patched.classesDirs.any { new File(it, element.path).isFile() }
        }
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
def generateMfclPatch = tasks.register('generateMfclPatch', JavaExec) {
    def classes = sourceSets.mfclPatch.output.classesDirs
    def out = mfclPatchDir.map { it.dir('generated') }
    inputs.files(classes).withPropertyName('patchClasses')
    inputs.files(configurations.mfclPatchBase).withPropertyName('mfcl')
    outputs.dir(out)
    classpath = sourceSets.mfclPatchTool.runtimeClasspath
    mainClass = 'github.com.gengyoubo.tcmodern.tc4.mfclpatch.tool.MfclPatchTool'
    // Classes and the index both go to one resources directory, so dev runs and the JAR see the same files.
    argumentProviders.add({ [classes.singleFile.absolutePath, configurations.mfclPatchBase.singleFile.absolutePath,
                             out.get().asFile.absolutePath, out.get().asFile.absolutePath] } as CommandLineArgumentProvider)
}
sourceSets.main.resources.srcDir(generateMfclPatch)
sourceSets.main.resources.srcDir(files(mfclPatchDir.map { it.dir('legacy') }).builtBy(mfclPatchLegacyJar))
tasks.named('jar', Jar) { manifest.attributes('MixinConfigs': 'tc4modern.mfclpatch.mixins.json') }
tasks.named('jarJar') { manifest.attributes('MixinConfigs': 'tc4modern.mfclpatch.mixins.json') }

// Independently implemented binary compatibility API, loaded only in MFCL's old class loader.
// The tiny compile stubs are never packaged or added to the modern class path.
sourceSets {
    legacyBaublesStubs
    legacyBaubles
    legacyBaublesTest
    legacyBaublesFixture
}
dependencies {
    legacyBaublesCompileOnly sourceSets.legacyBaublesStubs.output
    legacyBaublesTestImplementation sourceSets.legacyBaubles.output
    legacyBaublesTestImplementation sourceSets.legacyBaublesStubs.output
    legacyBaublesTestImplementation platform('org.junit:junit-bom:5.11.4')
    legacyBaublesTestImplementation 'org.junit.jupiter:junit-jupiter'
    legacyBaublesTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    legacyBaublesFixtureCompileOnly sourceSets.legacyBaublesStubs.output
    legacyBaublesFixtureCompileOnly sourceSets.legacyBaubles.output
}
tasks.named('compileLegacyBaublesJava', JavaCompile) { options.release = 8 }
tasks.named('compileLegacyBaublesStubsJava', JavaCompile) { options.release = 8 }
tasks.named('compileLegacyBaublesFixtureJava', JavaCompile) { options.release = 8 }
tasks.register('legacyBaublesFixtureJar', Jar) {
    archiveFileName = 'tc4modern-bauble-fixture-1.7.10.jar'
    destinationDirectory = layout.buildDirectory.dir('fixtures')
    from sourceSets.legacyBaublesFixture.output
}
tasks.register('legacyBaublesJar', Jar) {
    archiveFileName = 'tc4modern-baubles-bridge-1.7.10.jar'
    destinationDirectory = layout.buildDirectory.dir('legacy')
    from sourceSets.legacyBaubles.output
}
tasks.named('processResources') {
    from(tasks.named('legacyBaublesJar')) { into 'tc4modern/legacy' }
}
tasks.named('test') { dependsOn tasks.named('legacyBaublesJar') }
tasks.register('legacyBaublesTest', Test) {
    testClassesDirs = sourceSets.legacyBaublesTest.output.classesDirs
    classpath = sourceSets.legacyBaublesTest.runtimeClasspath
    useJUnitPlatform()
}
tasks.named('check') { dependsOn tasks.named('legacyBaublesTest') }

tasks.named('test') { useJUnitPlatform() }

// The full MFCL runtime is resolved from the MFCL Maven repository (see dependencies above).
minecraft {
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory rootProject.file(rootProject.devProperty('gameDir').getOrElse('run'))
            property 'forge.logging.console.level', 'info'
            // Dependencies that use Mixin (Curios) ship SRG refmaps; remap them in development runs.
            property 'mixin.env.remapRefMap', 'true'
            args '-mixin.config=tc4modern.mfclpatch.mixins.json'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            if (providers.gradleProperty('jeiSmokeTest').isPresent()) {
                property 'tc4modern.jeiSmokeTest', 'true'
            }
            if (providers.gradleProperty('mfclApiSmokeTest').isPresent()) {
                property 'mfcl.test.api', 'true'
            }
            if (providers.gradleProperty('cinnabarSmokeTest').isPresent()) {
                property 'tc4modern.cinnabarSmokeTest', 'true'
            }
            if (providers.gradleProperty('workbookSmokeTest').isPresent()) {
                property 'tc4modern.workbookSmokeTest', 'true'
            }
            if (providers.gradleProperty('nativeResearchSmokeTest').isPresent()) {
                property 'tc4modern.nativeResearchSmokeTest', 'true'
            }
            if (providers.gradleProperty('ftbQuestsSmokeTest').isPresent()) {
                property 'tc4modern.ftbQuestsSmokeTest', 'true'
            }
            if (providers.gradleProperty('nativeLeavesSmokeTest').isPresent()) {
                property 'tc4modern.nativeLeavesSmokeTest', 'true'
            }
            if (providers.gradleProperty('curiosSmokeTest').isPresent()) {
                property 'tc4modern.curiosSmokeTest', 'true'
            }
            if (providers.gradleProperty('formedPreviewSmokeTest').isPresent()) {
                property 'tc4modern.formedPreviewSmokeTest', 'true'
            }
            if (providers.gradleProperty('multiblockSmokeTest').isPresent()) {
                property 'tc4modern.multiblockSmokeTest', 'true'
            }
            if (providers.gradleProperty('nodeReactorSmokeTest').isPresent()) {
                property 'tc4modern.nodeReactorSmokeTest', 'true'
            }
            if (providers.gradleProperty('deconstructionSmokeTest').isPresent()) {
                property 'tc4modern.deconstructionSmokeTest', 'true'
            }
            if (providers.gradleProperty('primalFurnaceSmokeTest').isPresent()) {
                property 'tc4modern.primalFurnaceSmokeTest', 'true'
            }
            if (providers.gradleProperty('modernScannerSmokeTest').isPresent()) {
                property 'tc4modern.modernScannerSmokeTest', 'true'
            }
            if (providers.gradleProperty('researchDeskSmokeTest').isPresent()) {
                property 'tc4modern.researchDeskSmokeTest', 'true'
            }
            if (providers.gradleProperty('bookSmokeTest').isPresent()) {
                property 'tcmodernlib.bookSmokeTest', 'true'
            }
            if (rootProject.devProperty('legacyRuntimeDir').isPresent()) {
                property 'mfcl.legacyRuntimeDir', rootProject.file(rootProject.devProperty('legacyRuntimeDir').get()).absolutePath
            }
            mods {
                tcmodernlib {
                    source project(':tc-modern-lib').sourceSets.main
                }
                tc4modern { source sourceSets.main }
            }
        }
        client { }
        server { args '--nogui' }
    }
}
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn project(':tc-modern-lib').tasks.named('classes')
}
// Test fixture is opt-in and is never bundled with either production mod.
tasks.matching { it.name == 'runClient' }.configureEach {
    if (providers.gradleProperty('curiosSmokeFixture').isPresent()) {
        dependsOn tasks.named('legacyBaublesFixtureJar')
        doFirst {
            copy {
                from tasks.named('legacyBaublesFixtureJar')
                into rootProject.file(rootProject.devProperty('gameDir').getOrElse('run') + '/mods/1.7.10')
            }
        }
    }
}
// ForgeGradle resolves source-set task names in the launching project. Lib's
// main output already includes its API; build foreign resources explicitly too.
tasks.matching { it.name in ['prepareRunClientCompile', 'prepareRunServerCompile'] }.configureEach {
    dependsOn project(':tc-modern-lib').tasks.named('classes')
}
