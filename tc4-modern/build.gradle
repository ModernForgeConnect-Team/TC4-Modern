base { archivesName = 'tc4-modern' }

repositories {
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    implementation project(':tc-modern-lib')
    compileOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-forge-api:${rootProject.jei_version}")
    // Optional in production. Disable in development with -PwithJei=false.
    if (rootProject.devProperty('withJei').getOrElse('true').toBoolean()) {
        runtimeOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}")
    }
    testImplementation files(rootProject.mfclApiFile)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

def mfclRuntime = rootProject.devProperty('mfclRuntimeJar').orElse(providers.provider {
    def bundled = rootProject.file("libs/mfcl-${rootProject.mfcl_version}.jar")
    bundled.isFile() ? bundled.absolutePath : null
})
if (mfclRuntime.isPresent()) {
    def runtimeJar = rootProject.file(mfclRuntime.get())
    repositories { flatDir { dirs runtimeJar.parentFile } }
    // ForgeGradle cannot remap files(...) dependencies in a development client.
    def artifactName = runtimeJar.name.replaceFirst(/\.jar$/, '')
    dependencies { runtimeOnly fg.deobf("local.mfcl:${artifactName}:local") }
}

tasks.register('verifyMfclRuntime') {
    doLast {
        if (!mfclRuntime.isPresent() || !rootProject.file(mfclRuntime.get()).isFile()) {
            throw new GradleException('Missing full MFCL runtime. Place mfcl-0.1.0.jar with Developer API support in root libs/, set mfclRuntimeJar in gradle-local.properties, or pass -PmfclRuntimeJar=/path/to/full/mfcl-0.1.0.jar. See README.md.')
        }
        new java.util.zip.ZipFile(rootProject.file(mfclRuntime.get())).withCloseable { archive ->
            for (entry in ['META-INF/mods.toml', 'github/com/gengyoubo/mfcl/api/LegacyRuntime.class',
                           'META-INF/services/github.com.gengyoubo.mfcl.api.spi.RuntimeProvider']) {
                if (archive.getEntry(entry) == null) {
                    throw new GradleException("MFCL runtime lacks ${entry}; supply a full MFCL build with Developer API support, not an API-only or older runtime JAR.")
                }
            }
        }
    }
}

minecraft {
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory rootProject.file(rootProject.devProperty('gameDir').getOrElse('run'))
            property 'forge.logging.console.level', 'info'
            if (providers.gradleProperty('jeiSmokeTest').isPresent()) {
                property 'tc4modern.jeiSmokeTest', 'true'
            }
            if (providers.gradleProperty('mfclApiSmokeTest').isPresent()) {
                property 'mfcl.test.api', 'true'
            }
            if (rootProject.devProperty('legacyRuntimeDir').isPresent()) {
                property 'mfcl.legacyRuntimeDir', rootProject.file(rootProject.devProperty('legacyRuntimeDir').get()).absolutePath
            }
            mods {
                tcmodernlib {
                    source project(':tc-modern-lib').sourceSets.main
                }
                tc4modern { source sourceSets.main }
            }
        }
        client { }
        server { args '--nogui' }
    }
}
tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn 'verifyMfclRuntime'
    dependsOn project(':tc-modern-lib').tasks.named('classes')
}
// ForgeGradle resolves source-set task names in the launching project. Lib's
// main output already includes its API; build foreign resources explicitly too.
tasks.matching { it.name in ['prepareRunClientCompile', 'prepareRunServerCompile'] }.configureEach {
    dependsOn project(':tc-modern-lib').tasks.named('classes')
}
