name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: python tools/prepare_mfcl_api.py
      - run: bash gradlew --no-daemon build
      - run: bash gradlew --no-daemon :tc4-modern:runClient :tc4-modern:runServer --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: tc-modern-jars
          path: |
            tc-modern-lib/build/libs/*.jar
            tc4-modern/build/libs/*.jar
