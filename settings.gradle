pluginManagement {
    // Prefer the neighboring MFCL checkout during local development; published plugin repositories remain the fallback.
    if (file('../ModernForgeConnectLoader/gradle-plugin').isDirectory()) {
        includeBuild('../ModernForgeConnectLoader/gradle-plugin')
    }
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven {
            url = uri("https://raw.githubusercontent.com/ModernForgeConnect-Team/ModernForgeConnectLoader/master/mcmodsrepo")
        }
    }
}

rootProject.name = 'TC4-Modern'
include 'tc-modern-lib', 'tc4-modern'
