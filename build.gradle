plugins {
    id 'base'
    id 'net.minecraftforge.gradle' version '6.0.54' apply false
}

ext.mfclApiFile = file(providers.gradleProperty('mfclApiJar')
        .getOrElse("libs/mfcl-${mfcl_version}-api.jar"))

tasks.register('verifyMfclApi') {
    group = 'verification'
    description = 'Check that the standalone MFCL compile API is available.'
    doLast {
        if (!mfclApiFile.isFile()) {
            throw new GradleException('Missing MFCL API: run python tools/prepare_mfcl_api.py with JDK 17, or pass -PmfclApiJar=/path/to/mfcl-api.jar. See README.md.')
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'maven-publish'

    group = rootProject.mod_group
    version = rootProject.mod_version
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        withSourcesJar()
    }
    repositories { mavenCentral() }
    minecraft { mappings channel: 'official', version: rootProject.minecraft_version }
    dependencies {
        minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
        compileOnly files(rootProject.mfclApiFile)
    }
    tasks.withType(JavaCompile).configureEach {
        dependsOn rootProject.tasks.named('verifyMfclApi')
        options.encoding = 'UTF-8'
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    tasks.named('processResources', ProcessResources) {
        inputs.property('version', project.version)
        filesMatching('META-INF/mods.toml') { expand version: project.version }
    }
    tasks.named('jar') { finalizedBy 'reobfJar' }
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifact tasks.named('jar')
                artifact tasks.named('sourcesJar')
            }
        }
    }
}

tasks.named('assemble') { dependsOn subprojects.collect { it.tasks.named('assemble') } }
tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
