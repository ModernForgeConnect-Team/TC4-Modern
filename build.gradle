plugins {
    id 'base'
    id 'net.minecraftforge.gradle' version '6.0.54' apply false
}

// Machine-specific paths stay out of the shared Gradle properties and Git.
def developerProperties = new Properties()
def developerFile = file('gradle-local.properties')
if (developerFile.isFile()) {
    developerFile.withReader('UTF-8') { developerProperties.load(it) }
}
ext.devProperty = { String key ->
    providers.gradleProperty(key).orElse(providers.provider { developerProperties.getProperty(key) })
}
// Local MFCL builds are useful while developing a public API before its Maven release.
def localMfclApi = devProperty('mfclApiJar')
if (localMfclApi.isPresent() && !file(localMfclApi.get()).isFile()) {
    throw new GradleException("MFCL API JAR not found: ${localMfclApi.get()}. Update or remove mfclApiJar in gradle-local.properties (or the -P option).")
}
// MFCL's Maven release: the API-only JAR (classifier api) for compiling, the full mod for running and nesting.
def mfclModule = 'github.com.gengyoubo.mfcl:ModernForgeConnectLoader'
ext.mfclApiDependency = localMfclApi.isPresent()
        ? files(file(localMfclApi.get()))
        : "${mfclModule}:${mfcl_api_version}:api"
// The full MFCL mod: a local build when mfclRuntimeJar is set, otherwise the Maven release.
def localMfclRuntime = devProperty('mfclRuntimeJar')
if (localMfclRuntime.isPresent()) {
    def jarName = file(localMfclRuntime.get()).name
    def coordinates = (jarName =~ /^(.+?)-(\d.+)\.jar$/)
    if (!coordinates.matches()) throw new GradleException("Local MFCL JAR must have a name-version.jar filename: ${jarName}")
    ext.mfclRuntimeVersion = coordinates[0][2]
    ext.mfclRuntimeDependency = "local.mfcl:${coordinates[0][1]}:${mfclRuntimeVersion}"
} else {
    ext.mfclRuntimeVersion = mfcl_runtime_version
    ext.mfclRuntimeDependency = "${mfclModule}:${mfcl_runtime_version}"
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'maven-publish'

    group = rootProject.mod_group
    version = project.name == 'tc-modern-lib' ? rootProject.lib_version : rootProject.mod_version
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        withSourcesJar()
    }
    repositories {
        mavenCentral()
        maven {
            name = 'MFCL'
            url = rootProject.mfcl_maven
            content { includeGroup 'github.com.gengyoubo.mfcl' }
        }
        if (rootProject.devProperty('mfclRuntimeJar').isPresent()) {
            flatDir {
                dirs rootProject.file(rootProject.devProperty('mfclRuntimeJar').get()).parentFile
                content { includeGroup 'local.mfcl' }
            }
        }
    }
    minecraft { mappings channel: 'official', version: rootProject.minecraft_version }
    // Besides the plain JAR, build <name>-<version>-with-mfcl.jar with the unmodified MFCL mod nested inside.
    // Forge keeps one copy when MFCL is also installed separately or nested in the other mod.
    jarJar.enable()
    tasks.named('jarJar') {
        archiveClassifier = 'with-mfcl'
        finalizedBy 'reobfJarJar'
    }
    reobf.create('jarJar')
    dependencies {
        minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
        // Code compiles against the API only; the full mod is a runtime dependency (see tc4-modern).
        compileOnly rootProject.mfclApiDependency
        testCompileOnly rootProject.mfclApiDependency
        jarJar(rootProject.mfclRuntimeDependency) {
            transitive = false
            jarJar.ranged(it, "[${rootProject.mfclRuntimeVersion},)")
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    tasks.named('processResources', ProcessResources) {
        inputs.property('version', project.version)
        filesMatching('META-INF/mods.toml') { expand version: project.version }
    }
    tasks.named('jar') { finalizedBy 'reobfJar' }
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifact tasks.named('jar')
                artifact tasks.named('sourcesJar')
            }
        }
    }
}

tasks.named('assemble') { dependsOn subprojects.collect { it.tasks.named('assemble') } }
tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
